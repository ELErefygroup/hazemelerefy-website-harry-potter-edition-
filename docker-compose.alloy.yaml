# Alloy preview for MCIT AI (validation stack lives outside this repo path).
# MCIT AI serves on host port 8502; a local proxy on 3000 forwards Alloy's
# reserved preview path to that service so frontendPort stays 3000.
services:
  mcit-preview-note:
    image: alpine:3.20
    network_mode: host
    command: ["sh", "-c", "echo 'MCIT AI is expected on :8502 (proxied to Alloy via :3000).' && sleep infinity"]
