services:
  web:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      PNPM_CONFIG_ONLY_BUILT_DEPENDENCIES: "sharp,unrs-resolver"
    volumes:
      - .:/workspace
    command: bash -lc "corepack enable && pnpm install --no-frozen-lockfile && pnpm dev --port 3000 --hostname 0.0.0.0"
